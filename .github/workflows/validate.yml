name: Validate Atlas

on:
  push:
    branches: [master, main]
    paths:
      - 'skills/atlas/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'skills/atlas/**'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Schema & Coherence Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: skills/atlas/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: skills/atlas

      - name: Run validator
        run: node scripts/validate.js
        working-directory: skills/atlas

      - name: Run doctor
        run: node scripts/atlas/doctor.js
        working-directory: skills/atlas

  security:
    name: Secrets & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only on pull_request: on push events base and head resolve to the same
      # commit, which makes the TruffleHog action error out.
      - name: TruffleHog secret scan
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

      - name: Check for hardcoded tokens
        run: |
          if grep -rIn --exclude-dir=node_modules -E 'gh[pousr]_[A-Za-z0-9]{36}' skills/atlas/; then
            echo "::error::GitHub token pattern found in skills/atlas"
            exit 1
          fi
          echo "No hardcoded GitHub tokens detected"

  lint:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # find, not a ** glob: bash in Actions runs without globstar, so
      # scripts/**/*.js would silently match only one directory level.
      - name: Check script syntax
        run: |
          failed=0
          while IFS= read -r file; do
            node --check "$file" || failed=1
          done < <(find skills/atlas/scripts skills/atlas/tests -name '*.js' -type f 2>/dev/null)
          exit $failed

  file-count:
    name: Monitor File Count
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Count files in skills/atlas
        id: count
        run: |
          FILE_COUNT=$(find skills/atlas -type f -not -path '*/node_modules/*' | wc -l)
          echo "Total files in skills/atlas: $FILE_COUNT"
          echo "count=$FILE_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$FILE_COUNT" -gt 100 ]; then
            echo "::warning::skills/atlas has $FILE_COUNT files (soft limit is 100)"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const count = '${{ steps.count.outputs.count }}';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**Atlas file count:** ${count} files (soft limit 100)`
            });
