name: Validate Atlas

on:
  push:
    branches: [master, main]
    paths:
      - 'skills/atlas/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'skills/atlas/**'

jobs:
  validate:
    name: Schema & Coherence Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install
        working-directory: skills/atlas

      - name: Run validator
        run: node scripts/validate.js
        working-directory: skills/atlas

      - name: Run doctor
        run: node scripts/atlas/doctor.js
        working-directory: skills/atlas

  security:
    name: Secrets & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --json

      - name: Check for common secret patterns
        run: |
          set +e
          grep -r "SUPABASE_KEY\|OPENAI_API_KEY\|ANTHROPIC_API_KEY" skills/atlas/ || true
          grep -r "gho_\|ghp_" skills/atlas/ || true
          if grep -rq "gho_\|ghp_" skills/atlas/; then
            echo "❌ GitHub tokens found in code"
            exit 1
          fi
          echo "✅ No obvious tokens detected"

  lint:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Check script syntax
        run: |
          for file in skills/atlas/scripts/**/*.js skills/atlas/tests/**/*.js; do
            if [ -f "$file" ]; then
              node --check "$file" || exit 1
            fi
          done

      - name: Check for console.log left behind
        run: |
          if grep -r "console\.log" skills/atlas/scripts/ --include="*.js" | grep -v "// expected"; then
            echo "⚠️  Found console.log statements (not critical)"
          fi

  frontmatter:
    name: Validate Frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install
        working-directory: skills/atlas

      - name: Validate all .md frontmatter
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const glob = require('glob');

            const files = glob.sync('skills/atlas/**/*.md');
            let errors = 0;

            files.forEach(file => {
              const content = fs.readFileSync(file, 'utf8');
              if (!content.startsWith('---')) {
                console.log('⚠️  Missing frontmatter:', file);
                errors++;
              }
            });

            if (errors > 0) {
              console.log(\`Found \${errors} files with missing frontmatter\`);
              process.exit(1);
            }
          "

  file-count:
    name: Monitor File Count
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count files in skills/atlas
        run: |
          FILE_COUNT=$(find skills/atlas -type f | wc -l)
          echo "Total files in atlas: $FILE_COUNT"
          if [ $FILE_COUNT -gt 100 ]; then
            echo "⚠️  Warning: Over 100 files ($FILE_COUNT)"
          fi
          echo "FILE_COUNT=$FILE_COUNT" >> $GITHUB_OUTPUT
        id: count

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📊 **Atlas File Count:** ' + '${{ steps.count.outputs.FILE_COUNT }}' + ' files'
            })
