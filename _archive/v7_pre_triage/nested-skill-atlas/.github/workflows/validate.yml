name: Atlas Schema Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate skill integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm ci

      - name: Run validators
        run: node scripts/validate.js && node scripts/validate-v2.js

      - name: Install scoring-engine dependencies and test
        run: npm ci --prefix scoring-engine && npm test --prefix scoring-engine

      - name: Check for broken Markdown links (informational)
        continue-on-error: true
        run: |
          npx --yes markdown-link-check readme.md changelog.md \
            --config '{"ignorePatterns": [{"pattern": "^https://github.com/VpkDevs"}]}'
